<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="referrer" content="strict-origin-when-cross-origin" />
<meta name="robots" content="noindex" />
<title>MesoLab demo video</title>
<style>html, body { margin: 0; height: 100%; background: #000; } iframe { display: block; border: 0; width: 100%; height: 100%; }</style>
</head>
<body>
<!--
  YouTube embed relay for the MesoLab iOS/Android apps. Inside the app the page origin is
  capacitor://localhost (iOS), which YouTube rejects (error 152/153: missing embedder referrer).
  The app embeds this HTTPS page instead, and this page embeds the privacy-enhanced player.
  Only an 11-character video id is accepted; nothing else is passed through.
-->
<script>
  (function () {
    var id = new URLSearchParams(location.search).get('id') || '';
    if (!/^[\w-]{11}$/.test(id)) { document.body.textContent = 'Video not found.'; document.body.style.color = '#fff'; return; }
    var f = document.createElement('iframe');
    f.src = 'https://www.youtube-nocookie.com/embed/' + id + '?playsinline=1&rel=0&modestbranding=1&autoplay=1';
    f.title = 'Exercise demo video';
    f.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
    f.referrerPolicy = 'strict-origin-when-cross-origin';
    f.allowFullscreen = true;
    document.body.appendChild(f);
  })();
</script>
</body>
</html>
