  <body>
    <div id="root"><div id="boot" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;background:#0f1218;color:#e8ecf4;font-family:system-ui,sans-serif;text-align:center;padding:2rem"><p id="boot-msg" style="margin:0;font-size:1.1rem">Loading…</p><button id="boot-retry" type="button" onclick="location.reload()" style="display:none;padding:0.7rem 1.4rem;border-radius:10px;border:0;background:#ff7a45;color:#111;font-weight:700;font-size:1rem">Retry</button></div></div>
    <script>
      // Plain ES5 safety net: if the app hasn't started after 15 s, offer Retry instead of a blank screen.
      setTimeout(function () {
        if (window.__mesolabBooted) return;
        var m = document.getElementById('boot-msg'), b = document.getElementById('boot-retry');
        if (m) m.textContent = 'MesoLab is taking too long to start.';
        if (b) b.style.display = 'block';
      }, 15000);
      setTimeout(function () { var b = document.getElementById('boot-retry'); if (b && !window.__mesolabBooted) b.style.display = 'block'; }, 5000);
    </script>
  </body>
